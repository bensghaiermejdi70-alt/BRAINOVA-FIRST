let lang = 'fr';
let idx = 0;
let score = 0;
let answered = false;

function setLang() {
    lang = document.getElementById('lang').value;
    idx = 0;
    score = 0;
    answered = false;
    document.getElementById('result').textContent = '';
    document.getElementById('restartBtn').style.display = 'none';
    showQuestion();
    // Suppression du panneau des questions
}

function showQuestion() {
    const q = quizData[lang][idx];
    document.getElementById('question').textContent = q.q;
    document.getElementById('score').textContent = `Question ${idx+1} / ${quizData[lang].length} | Score: ${score}`;
    const answersDiv = document.getElementById('answers');
    answersDiv.innerHTML = '';
    q.a.forEach((ans, i) => {
        const btn = document.createElement('button');
        btn.textContent = ans;
        btn.onclick = () => select(i);
        answersDiv.appendChild(btn);
    });
    answered = false;
    document.getElementById('nextBtn').disabled = true;
}

function select(i) {
    if(answered) return;
    answered = true;
    const q = quizData[lang][idx];
    const btns = document.querySelectorAll('.answers button');
    btns.forEach((btn, j) => {
        if(j === q.c) btn.style.background = '#00ff99';
        if(j === i && i !== q.c) btn.style.background = '#ff3b3b';
        btn.disabled = true;
    });
    if(i === q.c) score++;
    document.getElementById('nextBtn').disabled = false;
}

function next() {
    if(idx < quizData[lang].length-1) {
        idx++;
        showQuestion();
    } else {
        document.getElementById('result').textContent = `Fin du quiz ! Score: ${score} / ${quizData[lang].length}`;
        document.getElementById('restartBtn').style.display = '';
        document.getElementById('nextBtn').disabled = true;
    }
}

function restart() {
    idx = 0;
    score = 0;
    document.getElementById('result').textContent = '';
    document.getElementById('restartBtn').style.display = 'none';
    showQuestion();
}

setLang();
    </script>
