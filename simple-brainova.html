<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 BRAINOVA - 36 Jeux Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .logo {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0,255,255,0.5);
        }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .lang-selector {
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }
        
        .lang-selector:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0,255,255,0.5);
        }
        
        .buttons {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-premium {
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            color: #333;
        }
        
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,215,0,0.4);
        }
        
        .btn-share {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }
        
        .intro {
            text-align: center;
            padding: 40px 20px;
        }
        
        .intro h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .games-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: linear-gradient(145deg, rgba(0,0,0,0.4), rgba(255,255,255,0.05));
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .game-card:hover {
            transform: translateY(-10px) rotateY(5deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .game-card.free {
            border: 3px solid #00ff88;
            box-shadow: 0 0 30px rgba(0,255,136,0.4), inset 0 0 15px rgba(0,255,136,0.1);
        }
        
        .game-card.free:hover {
            box-shadow: 0 0 40px rgba(0,255,136,0.6), 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,255,136,0.2);
        }
        
        .game-card.premium {
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.4), inset 0 0 15px rgba(255,215,0,0.1);
        }
        
        .game-card.premium:hover {
            box-shadow: 0 0 40px rgba(255,215,0,0.6), 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,215,0,0.2);
        }
        
        .game-card.premium.locked {
            opacity: 0.7;
        }
        
        .game-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: white;
        }
        
        .game-title {
            font-size: 16px;
            color: white;
            line-height: 1.3;
        }
        
        .lock-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            color: #ffd700;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .modal input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 16px;
            text-transform: uppercase;
        }
        
        .modal input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        .modal button {
            margin: 10px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-verify {
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            color: #333;
        }
        
        .btn-close {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        

    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🧠 BRAINOVA</div>
        <div class="header-controls">
            <select class="lang-selector" id="langSelect" onchange="changeLanguage()">
                <option value="fr">🇫🇷 Français</option>
                <option value="en">🇺🇸 English</option>
                <option value="es">🇪🇸 Español</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="ar">🇸🇦 العربية</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
            <div class="buttons">
                <button class="btn btn-premium" onclick="openPremiumModal()">🔑 Accès Premium</button>
                <button class="btn btn-share" onclick="openShareModal()">📤 Partager</button>
            </div>
        </div>
    </div>
    
    <div class="intro">
        <h1>🎮 36 Jeux Intelligents</h1>
        <p>Entraînez votre cerveau avec notre collection complète de jeux adaptatifs</p>
    </div>
    
    <div class="games-container" id="gamesContainer">
        <!-- Les jeux seront ajoutés ici par JavaScript -->
    </div>
    
    <!-- Modal Premium -->
    <div class="modal" id="premiumModal">
        <div class="modal-content">
            <h2 style="color: #ffd700; margin-bottom: 20px;">🎮 BRAINOVA PREMIUM</h2>
            <p>Entrez votre code d'accès premium</p>
            
            <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin: 20px 0;">
                <strong>📝 Codes de Test:</strong><br>
                <code style="color: #00ff00;">BRAIN-2024-DEMO1</code><br>
                <code style="color: #00ff00;">BRAIN-2024-DEMO2</code>
            </div>
            
            <input type="text" id="premiumCode" placeholder="Entrez votre code premium" />
            
            <div>
                <button class="btn-verify" onclick="verifyCode()">🔓 Vérifier</button>
                <button class="btn-close" onclick="closePremiumModal()">❌ Fermer</button>
            </div>
            
            <div id="result" style="margin-top: 20px; padding: 10px; border-radius: 5px; display: none;"></div>
        </div>
    </div>
    

    
    <script>
        let isPremium = false;
        
        const gameNames = [
            "Quantum Tetris 2077", "Memory Quantique", "Neural Puzzle Master", "Quantum Chess", "Jeux de Dames", 
            "Pac-Man", "Simon Says", "Speed Challenge", "Cyber Checker", "Demo Playground",
            "Quantum Monopoly", "Neural Poker", "Blackjack Quantum", "Solitaire Fusion", "Mystic Forest Quest",
            "Enigma Hunter", "Neural Racing", "Cyber Shooter", "Quantum Dots", "Neural Rhythm",
            "Cyber Pinball", "Quantum Pipes", "Neural Slots", "Cyber Darts", "Quantum Bubbles",
            "Neural Dice", "Cyber Pool", "Quantum Tiles", "Neural Trivia", "Cyber Asteroids",
            "Quantum Crystals", "Neural Infinity", "Algorithme Visuel", "Physique Quantique", "Test QI", "Conscience Artificielle"
        ];
        
        function log(message) {
            const debug = document.getElementById('debug');
            debug.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' - ' + message;
            console.log(message);
        }
        
        function checkPremiumStatus() {
            try {
                isPremium = localStorage.getItem('brainova_premium_status') === 'true';
                log('🔐 Statut Premium: ' + (isPremium ? 'ACTIF' : 'INACTIF'));
                return isPremium;
            } catch(e) {
                log('❌ Erreur localStorage: ' + e.message);
                return false;
            }
        }
        
        function createGameCards() {
            log('🎮 Création des 36 cartes de jeux...');
            const container = document.getElementById('gamesContainer');
            if (!container) {
                log('❌ Container introuvable !');
                return;
            }
            
            container.innerHTML = '';
            
            for (let i = 1; i <= 36; i++) {
                const card = document.createElement('div');
                card.className = 'game-card';
                
                const isLocked = (i > 10 && !isPremium);
                
                if (i <= 10) {
                    card.classList.add('free');
                } else {
                    card.classList.add('premium');
                    if (isLocked) {
                        card.classList.add('locked');
                        const lockIcon = document.createElement('div');
                        lockIcon.className = 'lock-icon';
                        lockIcon.innerHTML = '🔒';
                        card.appendChild(lockIcon);
                    }
                }
                
                const number = document.createElement('div');
                number.className = 'game-number';
                number.textContent = i;
                
                const title = document.createElement('div');
                title.className = 'game-title';
                title.textContent = gameNames[i-1];
                
                card.appendChild(number);
                card.appendChild(title);
                
                card.addEventListener('click', () => {
                    if (isLocked) {
                        log('🔒 Jeu ' + i + ' verrouillé - Ouverture modal premium');
                        openPremiumModal();
                    } else {
                        log('🎮 Lancement jeu ' + i + ': ' + gameNames[i-1]);
                        alert('🎮 Jeu ' + i + ': ' + gameNames[i-1] + '\n\n(Ouverture du jeu bientôt disponible)');
                    }
                });
                
                container.appendChild(card);
            }
            
            log('✅ 36 cartes créées avec succès !');
        }
        
        function openPremiumModal() {
            document.getElementById('premiumModal').style.display = 'flex';
        }
        
        function closePremiumModal() {
            document.getElementById('premiumModal').style.display = 'none';
        }
        
        function verifyCode() {
            const code = document.getElementById('premiumCode').value.trim().toUpperCase();
            const result = document.getElementById('result');
            
            if (!code) {
                showResult('❌ Veuillez entrer un code', 'error');
                return;
            }
            
            const validCodes = ['BRAIN-2024-DEMO1', 'BRAIN-2024-DEMO2'];
            
            if (validCodes.includes(code)) {
                localStorage.setItem('brainova_premium_status', 'true');
                isPremium = true;
                showResult('✅ Code activé avec succès !<br>Rechargement...', 'success');
                setTimeout(() => {
                    location.reload();
                }, 2000);
            } else {
                showResult('❌ Code invalide', 'error');
            }
        }
        
        function showResult(message, type) {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.style.background = type === 'success' ? 'rgba(0,255,0,0.2)' : 'rgba(255,0,0,0.2)';
            result.style.border = '2px solid ' + (type === 'success' ? '#00ff00' : '#ff0000');
            result.innerHTML = message;
        }
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            log('✅ DOM chargé');
            checkPremiumStatus();
            createGameCards();
            
            log('🎯 Initialisation terminée');
        });
        
        log('📝 Script chargé');
    </script>
</body>
</html>
