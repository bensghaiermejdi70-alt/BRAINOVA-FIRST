<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAINOVA — 36 Jeux Intelligents Premium | Plateforme IA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --accent1:#00ffff; --accent2:#ff00ff; --neon:#ff568c; --gold:#ffd700;
  --success:#00ff88; --error:#ff6b6b; --warning:#ffaa00;
}
html,body{height:100%;margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:#fff;overflow-x:hidden;zoom:0.98;}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);gap:12px;border-bottom:1px solid rgba(0,255,255,0.08);position:relative;overflow:hidden}
#logoText{font-family:'Orbitron',sans-serif;font-size:34px;font-weight:900;color:var(--accent1);text-shadow:0 0 10px var(--accent1),0 0 20px var(--accent2);display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.controls{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
#langWrap{position:relative}
#langSelect{appearance:none;padding:8px 12px;border-radius:14px;border:2px solid var(--accent1);font-weight:700;background:linear-gradient(135deg,rgba(0,255,255,0.12),rgba(255,0,255,0.08));color:#fff;cursor:pointer;min-width:160px;box-shadow:0 8px 25px rgba(0,255,255,0.2);backdrop-filter:blur(6px)}
#langWrap::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent1)}
#authContainer{display:flex;gap:10px;align-items:center}
.authBtn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;padding:10px 18px;color:#fff;border-radius:18px;cursor:pointer;font-weight:700}
#shareBtn,#premiumBtn{padding:8px 14px;border-radius:12px;border:none;font-weight:700;cursor:pointer;color:#001;margin-left:8px;box-shadow:0 6px 18px rgba(0,0,0,0.35)}
#shareBtn{background:linear-gradient(90deg,#ffec00,#ff7800)}
#premiumBtn{background:linear-gradient(90deg,#00ffea,#0078ff)}
.intro{max-width:1100px;margin:20px auto;padding:18px;border-radius:12px;background:rgba(0,0,0,0.45);text-align:center}
.intro h2{margin:6px 0;color:var(--gold);text-shadow:0 0 6px var(--gold)}
.games-grid{max-width:1200px;margin:16px auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;perspective:1200px}
.card{background:rgba(255,255,255,0.03);border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,0.04);box-shadow:0 6px 22px rgba(0,0,0,0.4);transition:transform .35s,box-shadow .35s;position:relative;min-height:110px}
.card:hover{transform:translateY(-6px)}
.card .num{font-size:22px;font-weight:900;margin-bottom:6px;background:linear-gradient(90deg,var(--accent1),#8a2be2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .title{font-size:16px;text-align:center;color:#fff}
.card.locked{opacity:0.9;filter:grayscale(0.15)}
.card.locked::after{content:"🔒";position:absolute;top:12px;right:12px;font-size:20px}
#gameOverlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.96);align-items:stretch}
#overlayInner{position:relative;flex:1;display:flex;flex-direction:column}
#gameFrame{width:100%;height:100%;border:0;display:block}
.overlayTopLeft{position:absolute;top:16px;left:16px;z-index:10010;display:flex;gap:8px}
.overlayBtn{background:#ff3860;border:none;color:#fff;padding:10px 14px;border-radius:11px;font-weight:700;cursor:pointer}
.modal{display:none;position:fixed;inset:0;z-index:10020;background:rgba(0,0,0,0.85);align-items:center;justify-content:center}
.modalCard{width:420px;background:linear-gradient(180deg,#fff,#f3f6ff);padding:18px;border-radius:12px;display:flex;flex-direction:column;gap:10px;color:#001;box-shadow:0 10px 40px rgba(0,0,0,0.25)}
.modalCard input{padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);background:#fff}
.modalCard .btn{padding:10px;border-radius:8px;border:0;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#001}
.premium-modal .modalCard{background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff}
.toast{position:fixed;top:24px;right:24px;padding:12px 16px;border-radius:8px;color:#fff;z-index:10100}
.toast.success{background:linear-gradient(90deg,var(--success),#00cc66)}
.toast.error{background:linear-gradient(90deg,var(--error),#ff4757)}
.toast.info{background:linear-gradient(90deg,#3498db,#9b59b6)}
.hidden{display:none !important}
@media(max-width:640px){#logoText{font-size:24px}.modalCard{width:92%}}
</style>
</head>
<body>

<header>
  <div id="logoText"><span class="emoji">🧠</span><span>Brainova</span></div>
  <div class="controls">
    <div id="langWrap">
      <select id="langSelect" aria-label="Langue">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="zh">中文</option>
      </select>
    </div>
    <div id="authContainer">
      <button class="authBtn hidden" id="loginBtn">Connexion</button>
      <button class="authBtn hidden" id="signupBtn">Inscription</button>
      <button id="premiumBtn">Premium</button>
      <button id="shareBtn">Partager</button>
    </div>
  </div>
</header>

<section class="intro">
  <h2 id="introTitle">🎮 Découvrez nos 36 Jeux Intelligents</h2>
  <p id="introDesc">Entraînez votre cerveau avec notre sélection : 10 jeux gratuits et 26 jeux premium verrouillés.</p>
</section>

<main class="games-grid" id="gamesGrid" aria-live="polite"></main>

<!-- Overlay -->
<div id="gameOverlay" role="dialog" aria-modal="true">
  <div id="overlayInner">
    <div class="overlayTopLeft">
      <button id="overlayMenu" class="overlayBtn">🔙 Retour</button>
    </div>
    <iframe id="gameFrame" allow="fullscreen; autoplay; camera; microphone; geolocation"></iframe>
  </div>
</div>

<!-- Login Modal (only usable after premium) -->
<div id="loginModal" class="modal" aria-hidden="true">
  <div class="modalCard">
    <h3>Connexion</h3>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Mot de passe">
    <button class="btn" id="loginSubmit">Se connecter</button>
    <button class="btn" id="loginCancel" style="background:transparent;color:#001;border:1px solid rgba(0,0,0,0.08)">Annuler</button>
  </div>
</div>

<!-- Signup Modal (only usable after premium) -->
<div id="signupModal" class="modal" aria-hidden="true">
  <div class="modalCard">
    <h3>Inscription</h3>
    <input id="signupName" type="text" placeholder="Nom complet">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Mot de passe">
    <button class="btn" id="signupSubmit">S'inscrire</button>
    <button class="btn" id="signupCancel" style="background:transparent;color:#001;border:1px solid rgba(0,0,0,0.08)">Annuler</button>
  </div>
</div>

<!-- Premium Modal -->
<div id="premiumModal" class="modal premium-modal" aria-hidden="true">
  <div class="modalCard">
    <h3>Abonnement Premium</h3>
    <p>Débloquez les 26 jeux premium — 20 EUR / an.</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:6px">
      <button id="buyPremium" class="btn">Souscrire maintenant</button>
      <button id="premiumCancel" class="btn" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.12)">Annuler</button>
    </div>
  </div>
</div>

<div id="toastArea"></div>

<!-- Stripe JS -->
<script src="https://js.stripe.com/v3/"></script>

<script type="module">
// ---- TRANSLATIONS ----
const TRANSLATIONS = {
  fr:{introTitle:"🎮 Découvrez nos 36 Jeux Intelligents",introDesc:"10 jeux gratuits et 26 jeux premium verrouillés",overlayBack:"🔙 Retour",
      games:["Quantum Tetris 2077","Memory Quantique","Neural Puzzle Master","Quantum Chess","Jeux de Dames","Pac-Man","Simon Says","Speed Challenge","Cyber Checker","Demo Playground","Quantum Monopoly","Neural Poker","Blackjack Quantum","Solitaire Fusion","Mystic Forest Quest","Enigma Hunter","Neural Racing","Cyber Shooter","Quantum Dots","Neural Rhythm","Cyber Pinball","Quantum Pipes","Neural Slots","Cyber Darts","Quantum Bubbles","Neural Dice","Cyber Pool","Quantum Tiles","Neural Trivia","Cyber Asteroids","Quantum Crystals","Neural Infinity","Algorithme Visuel","Physique Quantique","Test QI","Conscience Artificielle"]},
  en:{introTitle:"🎮 Discover our 36 Smart Games",introDesc:"10 free games and 26 premium locked games",overlayBack:"🔙 Back",
      games:["Quantum Tetris 2077","Quantum Memory","Neural Puzzle Master","Quantum Chess","Checkers Game","Pac-Man","Simon Says","Speed Challenge","Cyber Checker","Demo Playground","Quantum Monopoly","Neural Poker","Quantum Blackjack","Fusion Solitaire","Mystic Forest Quest","Enigma Hunter","Neural Racing","Cyber Shooter","Quantum Dots","Neural Rhythm","Cyber Pinball","Quantum Pipes","Neural Slots","Cyber Darts","Quantum Bubbles","Neural Dice","Cyber Pool","Quantum Tiles","Neural Trivia","Cyber Asteroids","Quantum Crystals","Neural Infinity","Visual Algorithm","Quantum Physics","IQ Test","Artificial Consciousness"]},
  ar:{introTitle:"🎮 اكتشف 36 لعبة ذكية",introDesc:"10 ألعاب مجانية و26 لعبة مميزة مقفلة",overlayBack:"🔙 رجوع",games:[]},
  es:{introTitle:"🎮 Descubre nuestros 36 Juegos Inteligentes",introDesc:"10 juegos gratis y 26 premium bloqueados",overlayBack:"🔙 Volver",games:[]},
  de:{introTitle:"🎮 Entdecken Sie unsere 36 intelligenten Spiele",introDesc:"10 kostenlose Spiele und 26 Premium-Spiele gesperrt",overlayBack:"🔙 Zurück",games:[]},
  zh:{introTitle:"🎮 探索我们的36款智能游戏",introDesc:"10个免费游戏和26个付费锁定游戏",overlayBack:"🔙 返回",games:[]}
};

// ---- UI Helpers ----
function showToast(msg,type='info'){
  const area=document.getElementById('toastArea');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.textContent=msg;
  area.appendChild(t);
  setTimeout(()=> t.remove(),4000);
}

// ---- Game Grid ----
const GRID = document.getElementById('gamesGrid');
function renderGrid(lang='fr'){
  GRID.innerHTML='';
  const t = TRANSLATIONS[lang] || TRANSLATIONS['fr'];
  for(let i=1;i<=36;i++){
    const card = document.createElement('div');
    card.className = 'card';
    const titleText = t.games[i-1] || `Jeu ${i}`;
    card.innerHTML = `<div class="num">${i}</div><div class="title">${titleText}</div>`;
    // first 10 free
    if(i>10){
      card.classList.add('locked');
    }
    card.addEventListener('click', ()=>{
      onGameClick(i);
    });
    GRID.appendChild(card);
  }
}

// Try possible paths for iframe src
function resolveGamePath(n){
  const candidates = [
    `./jeux/jeux${n}.html`,
    `./jeux${n}.html`,
    `./games/jeux${n}.html`,
    `./jeux/Jeux${n}.html`,
    `./jeux/Jeux${n}.html`
  ];
  return candidates;
}

const overlay = document.getElementById('gameOverlay');
const frame = document.getElementById('gameFrame');
const overlayMenu = document.getElementById('overlayMenu');

function openGamePath(n){
  const paths = resolveGamePath(n);
  let loaded = false;
  // try sequentially by setting src and listening for load/error
  // We'll set first candidate; Netlify will serve 404 in iframe if missing, so fallback not perfect.
  frame.src = paths[0];
  overlay.style.display='flex';
  setTimeout(()=> {
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }, 120);
}

function closeOverlay(){
  frame.src='about:blank';
  overlay.style.display='none';
  try{ if(document.exitFullscreen) document.exitFullscreen(); }catch(e){}
}

overlayMenu && overlayMenu.addEventListener('click', closeOverlay);
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && overlay.style.display==='flex') closeOverlay(); });

// ---- Language ----
const langSelect = document.getElementById('langSelect');
langSelect.addEventListener('change', ()=> {
  applyLang(langSelect.value);
});
function applyLang(lang){
  const t = TRANSLATIONS[lang] || TRANSLATIONS['fr'];
  document.getElementById('introTitle').textContent = t.introTitle;
  document.getElementById('introDesc').textContent = t.introDesc;
  renderGrid(lang);
}
(function initLang(){
  const saved = localStorage.getItem('brainova_lang');
  const browser = (navigator.language||navigator.userLanguage||'fr').slice(0,2);
  const start = saved || (['fr','en','ar','es','de','zh'].includes(browser)?browser:'fr');
  langSelect.value = start;
  applyLang(start);
})();

// ---- Firebase (v12 modular) ----
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
const firebaseConfig = { apiKey:"AIzaSyAjnpgNwDdGtb46XRCvT_cU7AAU-25zw1U", authDomain:"brainova-c0295.firebaseapp.com", projectId:"brainova-c0295", storageBucket:"brainova-c0295.firebasestorage.app", messagingSenderId:"437705478313", appId:"1:437705478313:web:8b7a4c97b5d80e6d49d9b8", measurementId:"G-79M4HWKQ35" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ---- UI elements ----
const loginBtn = document.getElementById('loginBtn');
const signupBtn = document.getElementById('signupBtn');
const shareBtn = document.getElementById('shareBtn');
const premiumBtn = document.getElementById('premiumBtn');
const premiumModal = document.getElementById('premiumModal');
const buyPremiumBtn = document.getElementById('buyPremium');
const premiumCancel = document.getElementById('premiumCancel');
const loginModal = document.getElementById('loginModal');
const signupModal = document.getElementById('signupModal');
const loginCancel = document.getElementById('loginCancel');
const signupCancel = document.getElementById('signupCancel');
const loginSubmit = document.getElementById('loginSubmit');
const signupSubmit = document.getElementById('signupSubmit');

// ---- PREMIUM state management ----
function isPremiumActive(){
  return localStorage.getItem('brainova_premium') === 'true';
}
function setPremiumActive(val){
  localStorage.setItem('brainova_premium', val ? 'true' : 'false');
  updateUIForPremium();
}
function updateUIForPremium(){
  const premium = isPremiumActive();
  // show/hide auth buttons
  if(premium){
    loginBtn.classList.remove('hidden');
    signupBtn.classList.remove('hidden');
    shareBtn.classList.add('hidden'); // hide share when premium
    // unlock all games visually and functionally
    document.querySelectorAll('.card').forEach((c, idx)=>{
      if(c.classList.contains('locked')) c.classList.remove('locked');
    });
  }else{
    loginBtn.classList.add('hidden');
    signupBtn.classList.add('hidden');
    shareBtn.classList.remove('hidden');
    // lock premium games
    document.querySelectorAll('.card').forEach((c, idx)=>{
      const i = idx+1;
      if(i>10 && !c.classList.contains('locked')) c.classList.add('locked');
    });
  }
}

// initial UI state
document.addEventListener('DOMContentLoaded', ()=>{
  renderGrid(localStorage.getItem('brainova_lang')||'fr');
  updateUIForPremium();
});

// ---- Game click behavior ----
function onGameClick(n){
  if(n>10 && !isPremiumActive()){
    // show premium modal to subscribe
    premiumModal.style.display='flex';
    return;
  }
  // open game
  openGamePath(n);
}

// ---- Premium modal controls ----
premiumBtn.addEventListener('click', ()=> premiumModal.style.display='flex');
premiumCancel.addEventListener('click', ()=> premiumModal.style.display='none');
buyPremiumBtn.addEventListener('click', ()=> {
  // open Stripe link (as requested keep the current link)
  window.open("https://buy.stripe.com/cNi8wR7IC77o54icy49EI01","_blank");
  // set premium locally — in production you'd verify webhook from Stripe
  setTimeout(()=> {
    setPremiumActive(true);
    showToast('Abonnement détecté — accès Premium activé', 'success');
    premiumModal.style.display='none';
    // Optionally send an email via your backend or EmailJS (not configured here)
  }, 800);
});

// ---- Share button ----
shareBtn.addEventListener('click', ()=>{
  if(navigator.share){
    navigator.share({title:'Brainova',text:'Découvrez Brainova et ses 36 jeux intelligents!',url:window.location.href});
  }else{
    // fallback copy url
    navigator.clipboard?.writeText(window.location.href).then(()=> showToast('URL copiée dans le presse-papiers','info'), ()=> showToast('Partage non supporté','error'));
  }
});

// ---- Auth modals (only available when premium) ----
loginBtn.addEventListener('click', ()=> { if(isPremiumActive()) loginModal.style.display='flex'; else showToast('Abonnement requis pour se connecter','info'); });
signupBtn.addEventListener('click', ()=> { if(isPremiumActive()) signupModal.style.display='flex'; else showToast('Abonnement requis pour s\'inscrire','info'); });

loginCancel.addEventListener('click', ()=> loginModal.style.display='none');
signupCancel.addEventListener('click', ()=> signupModal.style.display='none');

loginSubmit.addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if(!email||!pass){ showToast('Remplissez email et mot de passe','error'); return; }
  try{
    await signInWithEmailAndPassword(auth,email,pass);
    loginModal.style.display='none';
    showToast('Connexion réussie','success');
  }catch(err){
    console.error(err);
    showToast('Erreur connexion: '+(err.message||err.code),'error');
  }
});

signupSubmit.addEventListener('click', async ()=>{
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass = document.getElementById('signupPassword').value;
  if(!name||!email||!pass){ showToast('Remplissez tous les champs','error'); return; }
  try{
    const userCred = await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(userCred.user, { displayName: name });
    signupModal.style.display='none';
    showToast('Inscription réussie','success');
  }catch(err){
    console.error(err);
    showToast('Erreur inscription: '+(err.message||err.code),'error');
  }
});

// Accessibility: close modals on Escape
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    document.querySelectorAll('.modal').forEach(m=> m.style.display='none');
    closeOverlay();
  }
});
</script>

</body>
</html>
