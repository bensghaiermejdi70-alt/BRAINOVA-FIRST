<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BRAINOVA — Jeux (plein écran)</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#071021;color:#fff}
  .games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:18px}
  .card{background:#0b1220;padding:12px;border-radius:10px;cursor:pointer;text-align:center}
  .card:hover{transform:translateY(-4px);transition:transform .18s}
  /* overlay full viewport - by default hidden */
  #gameOverlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;padding:8px}
  #overlayInner{position:relative;width:100%;height:100%;border-radius:0;overflow:hidden;display:flex;flex-direction:column}
  #overlayClose{position:absolute;right:12px;top:12px;z-index:50;background:#ff3860;border:none;color:#fff;border-radius:6px;padding:8px 10px;cursor:pointer}
  #gameFrame{width:100%;height:100%;border:0;display:block}
  #overlayMsg{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:20px;color:#cbd5e1;font-size:1rem}
</style>
</head>
<body>

<div style="padding:12px">
  <h1>BRAINOVA — Cliquez sur une carte</h1>
  <div class="games-grid" id="gamesGrid"></div>
</div>

<!-- Overlay unique -->
<div id="gameOverlay" role="dialog" aria-modal="true">
  <div id="overlayInner">
    <button id="overlayClose" aria-label="Fermer">✖</button>
    <iframe id="gameFrame" title="Jeu" src="" allow="fullscreen; autoplay; geolocation; microphone; camera"></iframe>
    <div id="overlayMsg" style="display:none"></div>
  </div>
</div>

<script>
/* Ex: 12 cartes pour démonstration ; adapte à 36 */
const games = [];
for(let i=1;i<=36;i++){
  games.push({id:i, title:`Jeu ${i}`, file:`jeux${i}.html`});
}
const grid = document.getElementById('gamesGrid');
function makeCard(g){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div style="font-weight:700">#${g.id}</div><div style="margin-top:8px">${g.title}</div>`;
  el.addEventListener('click', ()=> openGameFullscreen(g.file, g.title));
  return el;
}
games.forEach(g=>grid.appendChild(makeCard(g)));

/* Overlay and fullscreen logic */
const overlay = document.getElementById('gameOverlay');
const inner = document.getElementById('overlayInner');
const frame = document.getElementById('gameFrame');
const msg = document.getElementById('overlayMsg');
const closeBtn = document.getElementById('overlayClose');

async function fileExists(path){
  try{
    const res = await fetch(path, {method:'HEAD'});
    return res.ok;
  }catch(e){ return false; }
}

/* Open game in real fullscreen when possible */
async function openGameFullscreen(file, title){
  if(!/^jeux\d+\.html$/.test(file)){
    alert('Nom de fichier invalide.');
    return;
  }
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  msg.style.display = 'flex';
  msg.innerHTML = 'Vérification du jeu...';
  frame.style.display = 'none';
  frame.src = 'about:blank';
  const ok = await fileExists(file);
  if(!ok){
    msg.innerHTML = `Le fichier <strong>${file}</strong> est introuvable. Vérifie qu'il existe dans le même dossier.`;
    return;
  }
  // ready: set src then request fullscreen
  msg.style.display = 'none';
  frame.style.display = 'block';
  frame.src = file;
  frame.title = title || 'Jeu';
  // small delay to ensure iframe set before fullscreen request (important sur certains navigateurs)
  setTimeout(async ()=>{
    // Prefer requesting fullscreen on the iframe element (some browsers require it on an element inside the document)
    const target = inner; // we use inner container to include close button overlay (keeps control)
    if(target.requestFullscreen){
      try{
        await target.requestFullscreen({navigationUI: 'hide'});
        /* some browsers show the page controls; navigationUI hint helps hide them */
      }catch(err){
        /* user agent may block or fail: fallback to showing overlay full */
        makeOverlayFullManual();
      }
    } else if (target.webkitRequestFullscreen){
      // Safari iOS (older)
      target.webkitRequestFullscreen();
    } else {
      // no fullscreen API -> fallback to manual full overlay
      makeOverlayFullManual();
    }
  }, 120);
}

/* Fallback: force overlay to cover viewport (already position:fixed inset:0) — ensure no border radius */
function makeOverlayFullManual(){
  overlay.style.display = 'flex';
  inner.style.width = '100%';
  inner.style.height = '100%';
  // iframe already width/height 100%
}

/* Close and cleanup */
async function closeGame(){
  // exit fullscreen if active
  if(document.fullscreenElement){
    try { await document.exitFullscreen(); } catch(e) { /* ignore */ }
  } else if (document.webkitFullscreenElement){ // Safari
    try { document.webkitExitFullscreen(); } catch(e) {}
  }
  // hide overlay and cleanup iframe
  overlay.style.display = 'none';
  frame.src = 'about:blank';
  frame.style.display = 'none';
  msg.style.display = 'none';
  document.body.style.overflow = '';
}

/* events */
closeBtn.addEventListener('click', closeGame);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeGame(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && overlay.style.display==='flex') closeGame(); }, true);

/* Accessibility / handle exiting fullscreen via ESC by user */
document.addEventListener('fullscreenchange', ()=> {
  if(!document.fullscreenElement){
    // user exited fullscreen -> close overlay and clean iframe
    closeGame();
  }
});
</script>
</body>
</html>
