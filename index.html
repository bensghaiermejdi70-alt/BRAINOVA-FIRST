<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAINOVA — Plateforme 36 jeux (multilangue + Auth + Premium)</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --accent1:#00ffff; --accent2:#ff00ff; --neon:#ff568c; --gold:#ffd700;
}
html,body{height:100%;margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:#fff;overflow-x:hidden;}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);gap:12px}
#logoText{font-family:'Orbitron',sans-serif;font-size:34px;font-weight:700;color:var(--accent1);text-shadow:0 0 6px var(--accent1),0 0 16px var(--accent2);display:flex;align-items:center;gap:10px}
#logoText .emoji{font-size:34px}
.controls{display:flex;align-items:center;gap:12px}
#langWrap{position:relative}
#langSelect{appearance:none;-webkit-appearance:none;padding:8px 12px;border-radius:14px;border:0;font-weight:700;background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));color:#fff;cursor:pointer;min-width:140px;box-shadow:0 6px 20px rgba(0,0,0,0.4)}
#langWrap::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#fff}
#langSelect:focus{outline:none;box-shadow:0 0 24px var(--accent1)}
#langSelect option{color:#000;background-color:#fff}
#authContainer{display:flex;gap:8px;align-items:center}
.authBtn{padding:8px 12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#001;box-shadow:0 6px 18px rgba(0,0,0,0.35)}
.authBtn:hover{transform:translateY(-2px)}
#shareBtn,#premiumBtn{padding:8px 14px;border-radius:12px;border:none;font-weight:700;cursor:pointer;color:#001;margin-left:8px;box-shadow:0 6px 18px rgba(0,0,0,0.35)}
#shareBtn{background:linear-gradient(90deg,#ffec00,#ff7800)}
#premiumBtn{background:linear-gradient(90deg,#00ffea,#0078ff)}
#shareBtn.locked,#premiumBtn.locked{opacity:0.3;cursor:not-allowed}
.intro{max-width:1100px;margin:14px auto;padding:18px;border-radius:12px;background:rgba(0,0,0,0.45);text-align:center}
.intro h2{margin:6px 0;color:var(--gold);text-shadow:0 0 6px var(--gold)}
.games-grid{max-width:1200px;margin:16px auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;perspective:1200px}
.card{background:rgba(0,0,0,0.16);border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,0.04);box-shadow:0 6px 22px rgba(0,0,0,0.4);transition:transform .35s,box-shadow .35s;position:relative}
.card:hover{transform:translateY(-8px) rotateY(6deg);box-shadow:0 12px 40px rgba(0,0,0,0.6)}
.card .num{font-size:22px;font-weight:900;margin-bottom:6px;background:linear-gradient(90deg,var(--accent1),#8a2be2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .title{font-size:16px;text-align:center;color:#fff;text-shadow:0 0 6px rgba(255,215,0,0.06)}
.card.premium::after{content:"🌐";position:absolute;top:6px;right:10px;font-size:20px;}
.card.free{border:3px solid #00ffaa;box-shadow:0 0 25px #00ffaa, inset 0 0 10px rgba(0,255,170,0.2);}
.card.locked{border:3px solid #ffea00;box-shadow:0 0 25px #ffea00, inset 0 0 10px rgba(255,234,0,0.2);}
.card.locked.premium{border:3px solid #ffea00 !important;box-shadow:0 0 25px #ffea00, inset 0 0 10px rgba(255,234,0,0.2) !important;}
.card.testqi{border:3px solid #ffea00;box-shadow:0 0 25px #ffea00, inset 0 0 10px rgba(255,234,0,0.2);}
#gameOverlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.96);align-items:stretch}
#overlayInner{position:relative;flex:1;display:flex;flex-direction:column}
#gameFrame{width:100%;height:100%;border:0;display:block}
.overlayTopLeft{position:absolute;top:16px;left:16px;z-index:10010;display:flex;gap:8px}
.overlayBtn{background:#ff3860;border:none;color:#fff;padding:10px 14px;border-radius:11px;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(255,56,96,0.12)}
.overlayBtn.secondary{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#001}
.modal{display:none;position:fixed;inset:0;z-index:10020;background:rgba(0,0,0,0.85);align-items:center;justify-content:center}
.modalCard{width:360px;background:rgba(0,0,0,0.95);padding:18px;border-radius:12px;display:flex;flex-direction:column;gap:10px;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
.modalCard input, .modalCard textarea, .modalCard select{padding:10px;border-radius:8px;border:0;background:rgba(255,255,255,0.02);color:#fff}
.modalCard .btn{padding:10px;border-radius:8px;border:0;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#001}
@media(max-width:640px){#logoText{font-size:24px}.modalCard{width:90%}#langSelect{min-width:100px}}
</style>
</head>
<body>

<header>
  <div id="logoText"><span class="emoji">🧠</span><span>Brainova</span></div>
  <div class="controls">
    <div id="langWrap">
      <select id="langSelect" aria-label="Langue">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="zh">中文</option>
      </select>
    </div>
    <div id="authContainer">
      <button class="authBtn" id="loginBtn">Connexion</button>
      <button class="authBtn" id="signupBtn">Inscription</button>
      <button id="premiumBtn">Premium</button>
      <button id="shareBtn">Partager</button>
    </div>
  </div>
</header>

<section class="intro">
  <h2 id="introTitle">🎮 Découvrez nos 36 Jeux Intelligents</h2>
  <p id="introDesc">Entraînez votre cerveau avec notre collection complète de jeux adaptatifs alimentés par l'IA</p>
</section>

<main class="games-grid" id="gamesGrid" aria-live="polite"></main>

<!-- Overlay -->
<div id="gameOverlay" role="dialog" aria-modal="true">
  <div id="overlayInner">
    <div class="overlayTopLeft">
      <button id="overlayMenu" class="overlayBtn secondary">🔙 Retour</button>
    </div>
    <iframe id="gameFrame" allow="fullscreen; autoplay; camera; microphone; geolocation"></iframe>
  </div>
</div>

<!-- Auth Modals -->
<div id="loginModal" class="modal" aria-hidden="true">
  <div class="modalCard">
    <h3>Connexion</h3>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Mot de passe">
    <button class="btn" id="loginSubmit">Se connecter</button>
    <button class="btn" id="loginCancel" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.08)">Annuler</button>
  </div>
</div>

<div id="signupModal" class="modal" aria-hidden="true">
  <div class="modalCard">
    <h3>Inscription</h3>
    <input id="signupName" type="text" placeholder="Nom complet">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Mot de passe">
    <button class="btn" id="signupSubmit">S'inscrire</button>
    <button class="btn" id="signupCancel" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.08)">Annuler</button>
  </div>
</div>

<!-- Premium Modal -->
<div id="premiumModal" class="modal" aria-hidden="true">
  <div class="modalCard">
    <h3>Abonnement Premium</h3>
    <p>Débloquez tous les jeux Brainova pour seulement 20 EUR / an.</p>
    <button class="btn" id="premiumSubscribeBtn">S'abonner</button>
    <button class="btn" id="premiumCancel" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.08)">Annuler</button>
  </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script type="module">

import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Gestion de l'état d'authentification
onAuthStateChanged(auth, (user) => {
  if (user) {
    // Utilisateur connecté - vérifier son statut premium
    const savedPremium = localStorage.getItem('brainova_premium') === 'true';
    userPremium = savedPremium;
    isPremium = savedPremium;
    updateUIForAuthenticatedUser(user);
  } else {
    // Utilisateur déconnecté
    userPremium = false;
    isPremium = false;
    updateUIForGuestUser();
  }
  renderGrid(langSelect.value);
});

// Fonction pour mettre à jour l'UI utilisateur connecté
function updateUIForAuthenticatedUser(user) {
  document.getElementById('loginBtn').style.display = 'none';
  document.getElementById('signupBtn').style.display = 'none';
  
  // Créer un bouton de déconnexion s'il n'existe pas
  if (!document.getElementById('logoutBtn')) {
    const logoutBtn = document.createElement('button');
    logoutBtn.id = 'logoutBtn';
    logoutBtn.className = 'authBtn';
    logoutBtn.textContent = 'Déconnexion';
    logoutBtn.addEventListener('click', () => auth.signOut());
    document.getElementById('authContainer').appendChild(logoutBtn);
  }
}

// Fonction pour mettre à jour l'UI utilisateur invité
function updateUIForGuestUser() {
  document.getElementById('loginBtn').style.display = 'inline-block';
  document.getElementById('signupBtn').style.display = 'inline-block';
  
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.remove();
  }
}

// ================= GRID & PREMIUM LOGIC
// ================= TRANSLATIONS (6 langues)
const TRANSLATIONS = {
  fr: {introTitle:"🎮 Découvrez nos 36 Jeux Intelligents",introDesc:"Entraînez votre cerveau avec notre collection complète de jeux adaptatifs alimentés par l'IA",overlayBack:"🔙 Retour",

    games:["تيتريس الكمومي","ذاكرة الكم","سيد الألغاز العصبي","شطرنج الكم","لعبة الداما","باك مان","سيمون يقول","تحدي السرعة","الفاحص السيبراني","ملعب تجريبي","احتكار الكم","بوكر عصبي","بلاك جاك الكمومي","سوليتير الاندماج","مغامرة الغابة الغامضة","صياد الألغاز","سباق عصبي","مطلق النار السيبراني","نقاط الكم","الإيقاع العصبي","دبابيس السيبرانية","أنابيب الكم","آلات الحظ العصبية","سهام سيبرانية","فقاعات الكم","نرد عصبي","بلياردو الكم","بلاط عصبي","اختبار المعرفة","كويكبات سيبرانية","بلورات الكم","اللانهاية العصبية","الخوارزمية البصرية","الفيزياء الكمومية","اختبار الذكاء","الوعي الاصطناعي"]},
  es: {introTitle:"🎮 Descubre nuestros 36 Juegos Inteligentes",introDesc:"Entrena tu cerebro con nuestra colección completa de juegos adaptativos con IA",overlayBack:"🔙 Volver",
    games:["Tetris Cuántico 2077","Memoria Cuántica","Maestro de Rompecabezas Neural","Ajedrez Cuántico","Juego de Damas","Pac-Man","Simón Dice","Desafío de Velocidad","Verificador Cibernético","Campo de Pruebas","Monopolio Cuántico","Póker Neural","Blackjack Cuántico","Solitario Fusión","Bosque Místico","Cazador de Enigmas","Carrera Neural","Tirador Cibernético","Puntos Cuánticos","Ritmo Neural","Pinball Cibernético","Tuberías Cuánticas","Tragamonedas Neurales","Dardos Cibernéticos","Burbujas Cuánticas","Dados Neurales","Billar Cibernético","Fichas Cuánticas","Trivia Neural","Asteroides Cibernéticos","Cristales Cuánticos","Infinito Neural","Algoritmo Visual","Física Cuántica","Prueba de IQ","Conciencia Artificial"]},
  de: {introTitle:"🎮 Entdecken Sie unsere 36 intelligenten Spiele",introDesc:"Trainieren Sie Ihr Gehirn mit unserer vollständigen Sammlung KI-gestützter Spiele",overlayBack:"🔙 Zurück",
    games:["Quantum Tetris 2077","Quantum Memory","Neural Puzzle Master","Quantum Chess","Dame Spiel","Pac-Man","Simon Says","Speed Challenge","Cyber Checker","Demo Playground","Quantum Monopoly","Neural Poker","Quantum Blackjack","Fusion Solitaire","Mystic Forest Quest","Enigma Hunter","Neural Racing","Cyber Shooter","Quantum Dots","Neural Rhythm","Cyber Pinball","Quantum Pipes","Neural Slots","Cyber Darts","Quantum Bubbles","Neural Dice","Cyber Pool","Quantum Tiles","Neural Trivia","Cyber Asteroids","Quantum Crystals","Neural Infinity","Visueller Algorithmus","Quantenphysik","IQ Test","Künstliches Bewusstsein"]},
  zh: {introTitle:"🎮 探索我们的36款智能游戏",introDesc:"通过我们完整的AI驱动自适应游戏系列训练你的大脑",overlayBack:"🔙 返回",
    games:["量子俄罗斯方块2077","量子记忆","神经拼图大师","量子国际象棋","跳棋游戏","吃豆人","西蒙说","速度挑战","网络检查","演示游乐场","量子大富翁","神经扑克","量子二十一点","融合接龙","神秘森林探险","谜题猎人","神经赛车","网络射手","量子点","神经节奏","网络弹球","量子管道","神经老虎机","网络飞镖","量子泡泡","神经骰子","网络台球","量子方块","神经问答","网络小行星","量子水晶","神经无限","视觉算法","量子物理","智商测试","人工意识"]}
};
const grid=document.getElementById('gamesGrid');
let userPremium=false;

// Fonction de validation d'email
function isValidEmail(email) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return emailRegex.test(email);
}

function renderGrid(lang){
  grid.innerHTML='';
  const t=TRANSLATIONS[lang]||TRANSLATIONS['fr'];
  for(let i=1;i<=36;i++){
    const card=document.createElement('div'); card.className='card';
    
    // Jeux 11 à 36 verrouillés sauf si premium (y compris le test QI)
    const isLocked = (i >= 11 && !userPremium);
    
    // Appliquer les contours néon selon le groupe de jeux
    if (i >= 1 && i <= 10) {
      // Jeux 1-10 : contour vert (gratuits)
      card.classList.add('free');
    } else if (i >= 11 && i <= 36) {
      // Jeux 11-36 : contour jaune (premium)
      card.classList.add('locked');
    }
    
    if(isLocked) {
      card.classList.add('premium');
      // Réduire légèrement l'opacité mais garder les contours visibles
      card.style.opacity = '0.8';
      // Ajouter un cadenas
      const lockIcon = document.createElement('div');
      lockIcon.innerHTML = '🔒';
      lockIcon.style.cssText = 'position: absolute; top: 10px; right: 10px; font-size: 20px; z-index: 1; filter: none;';
      card.appendChild(lockIcon);
    }
    
    if(i===35) card.classList.add('testqi');
    
    const num=document.createElement('div'); num.className='num'; num.textContent=i;
    const title=document.createElement('div'); title.className='title'; title.textContent=t.games[i-1]||`Jeu ${i}`;
    card.appendChild(num); card.appendChild(title);
    
    card.addEventListener('click',()=>{
      if(isLocked){
        showSubscriptionMessage();
        return;
      }
      openGame(i);
    });
    
    grid.appendChild(card);
  }
  
  // Gestion de la visibilité des boutons Premium et Partager
  const premiumBtn = document.getElementById('premiumBtn');
  const shareBtn = document.getElementById('shareBtn');
  
  if(userPremium || isPremium) {
    // Utilisateur premium : cacher les boutons
    premiumBtn.style.display = 'none';
    shareBtn.style.display = 'none';
  } else {
    // Utilisateur non premium : afficher les boutons
    premiumBtn.style.display = 'inline-block';
    shareBtn.style.display = 'inline-block';
  }
}

// ================= GAME OVERLAY
const overlay=document.getElementById('gameOverlay');
const frame=document.getElementById('gameFrame');
const btnMenu=document.getElementById('overlayMenu');
let currentGame=null;
function openGame(n){ frame.src=`jeux${n}.html`; currentGame=n; overlay.style.display='flex'; setTimeout(()=>{ document.documentElement.requestFullscreen?.().catch(()=>{}); },100); }
function closeGame(){ frame.src='about:blank'; overlay.style.display='none'; currentGame=null; if(document.fullscreenElement){ document.exitFullscreen?.(); } }
btnMenu.addEventListener('click',closeGame);
document.addEventListener('keydown',e=>{if(e.key==='Escape' && overlay.style.display==='flex'){closeGame();}});

// ================= LANGUAGE
const langSelect=document.getElementById('langSelect');
function applyLanguage(lang){
  if(!TRANSLATIONS[lang]) lang='fr';
  localStorage.setItem('brainova_lang',lang);
  const t=TRANSLATIONS[lang];
  document.getElementById('introTitle').textContent=t.introTitle;
  document.getElementById('introDesc').textContent=t.introDesc;
  document.getElementById('overlayMenu').textContent=t.overlayBack;
  document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
  renderGrid(lang);
}
langSelect.addEventListener('change',()=>applyLanguage(langSelect.value));
applyLanguage(localStorage.getItem('brainova_lang')||'fr');

// ================= AUTH
const loginModal=document.getElementById('loginModal');
const signupModal=document.getElementById('signupModal');
const premiumModal=document.getElementById('premiumModal');
document.getElementById('loginBtn').addEventListener('click',()=>loginModal.style.display='flex');
document.getElementById('signupBtn').addEventListener('click',()=>signupModal.style.display='flex');
document.getElementById('loginCancel').addEventListener('click',()=>loginModal.style.display='none');
document.getElementById('signupCancel').addEventListener('click',()=>signupModal.style.display='none');

document.getElementById('loginSubmit').addEventListener('click',async ()=>{
  try{
    const email=document.getElementById('loginEmail').value.trim();
    const pwd=document.getElementById('loginPassword').value;
    
    // Validation des champs
    if (!email || !pwd) {
      alert('Veuillez remplir tous les champs');
      return;
    }
    
    if (!isValidEmail(email)) {
      alert('Format d\'email invalide');
      return;
    }
    
    await signInWithEmailAndPassword(auth,email,pwd);
    // L'état premium sera géré par onAuthStateChanged
    loginModal.style.display='none';
    alert("Connexion réussie !");
  }catch(e){
    let errorMessage = "Erreur de connexion";
    if (e.code === 'auth/user-not-found') {
      errorMessage = "Aucun compte trouvé avec cet email";
    } else if (e.code === 'auth/wrong-password') {
      errorMessage = "Mot de passe incorrect";
    } else if (e.code === 'auth/invalid-email') {
      errorMessage = "Format d'email invalide";
    }
    alert(errorMessage);
  }
});
document.getElementById('signupSubmit').addEventListener('click',async ()=>{
  try{
    const name=document.getElementById('signupName').value.trim();
    const email=document.getElementById('signupEmail').value.trim();
    const pwd=document.getElementById('signupPassword').value;
    
    // Validation des champs
    if (!name || !email || !pwd) {
      alert('Veuillez remplir tous les champs');
      return;
    }
    
    if (name.length < 2) {
      alert('Le nom doit contenir au moins 2 caractères');
      return;
    }
    
    if (!isValidEmail(email)) {
      alert('Format d\'email invalide');
      return;
    }
    
    if (pwd.length < 6) {
      alert('Le mot de passe doit contenir au moins 6 caractères');
      return;
    }
    
    const userCred=await createUserWithEmailAndPassword(auth,email,pwd);
    await updateProfile(userCred.user,{displayName:name});
    // L'état premium sera géré par onAuthStateChanged
    signupModal.style.display='none';
    alert("Inscription réussie ! Bienvenue " + name + " !");
  }catch(e){
    let errorMessage = "Erreur d'inscription";
    if (e.code === 'auth/email-already-in-use') {
      errorMessage = "Cette adresse email est déjà utilisée";
    } else if (e.code === 'auth/weak-password') {
      errorMessage = "Le mot de passe est trop faible";
    } else if (e.code === 'auth/invalid-email') {
      errorMessage = "Format d'email invalide";
    }
    alert(errorMessage);
  }
});

// ================= PREMIUM & STRIPE
// Vérifier l'état premium dans localStorage
let isPremium = localStorage.getItem('brainova_premium') === 'true';

// Fonction pour débloquer le premium
function unlockPremium() {
  isPremium = true;
  localStorage.setItem('brainova_premium', 'true');
  userPremium = true;
  renderGrid(langSelect.value);
  alert('Félicitations ! Tous les jeux sont maintenant débloqués !');
}

  `;
  
  const currentUrl = window.location.href;
  
  shareCard.innerHTML = `

    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 25px;">

        border: none; padding: 12px 20px; border-radius: 25px;
        color: white; font-weight: bold; cursor: pointer;
      ">📋 Copier le lien</button>
      
      <button id="shareTwitterBtn" style="
        background: linear-gradient(90deg, #1da1f2, #0d8bd9);
        border: none; padding: 12px 20px; border-radius: 25px;
        color: white; font-weight: bold; cursor: pointer;
      ">🐦 Twitter</button>
      
      <button id="shareFacebookBtn" style="
        background: linear-gradient(90deg, #4267B2, #365899);
        border: none; padding: 12px 20px; border-radius: 25px;
        color: white; font-weight: bold; cursor: pointer;
      ">📘 Facebook</button>
    </div>
    
    <button id="closeShareBtn" style="
      background: transparent; border: 2px solid rgba(255,255,255,0.3);
      padding: 10px 25px; border-radius: 25px; color: white;
      cursor: pointer;
    ">Fermer</button>
  `;
  
  shareModal.appendChild(shareCard);
  document.body.appendChild(shareModal);
  
  // Gestion des boutons
  document.getElementById('copyUrlBtn').addEventListener('click', () => {
    const urlInput = document.getElementById('shareUrl');
    urlInput.select();
    navigator.clipboard.writeText(currentUrl).then(() => {
      document.getElementById('copyUrlBtn').innerHTML = '✅ Copié !';
      setTimeout(() => {
        document.getElementById('copyUrlBtn').innerHTML = '📋 Copier le lien';
      }, 2000);
    });
  });
  
  document.getElementById('shareTwitterBtn').addEventListener('click', () => {
    const text = encodeURIComponent('Découvrez Brainova - 36 jeux intelligents pour entraîner votre cerveau ! 🧠✨');
    const url = encodeURIComponent(currentUrl);
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
  });
  
  document.getElementById('shareFacebookBtn').addEventListener('click', () => {
    const url = encodeURIComponent(currentUrl);
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
  });
  
  document.getElementById('closeShareBtn').addEventListener('click', () => {
    document.body.removeChild(shareModal);
  });
  
  // Fermer en cliquant en dehors
  shareModal.addEventListener('click', (e) => {
    if (e.target === shareModal) {
      document.body.removeChild(shareModal);
    }
  });
}

// Vérifier le statut premium au chargement
if (isPremium) {
  userPremium = true;
}

// Fonction pour vérifier le retour de Stripe
function checkStripeReturn() {
  const urlParams = new URLSearchParams(window.location.search);
  
  // Si l'utilisateur revient de Stripe avec succès
  if (urlParams.get('success') === 'true' || urlParams.get('payment_intent_status') === 'succeeded') {
    unlockPremium();
    // Nettoyer l'URL
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  
  // Si l'utilisateur annule le paiement
  if (urlParams.get('canceled') === 'true') {
    alert('Paiement annulé. Vous pouvez réessayer à tout moment.');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

// Vérifier au chargement de la page
document.addEventListener('DOMContentLoaded', () => {
  checkStripeReturn();
  
  // Attacher les événements après le chargement du DOM
  const premiumBtn = document.getElementById('premiumBtn');
  const shareBtn = document.getElementById('shareBtn');
  
  if (premiumBtn) {
    premiumBtn.addEventListener('click', showSubscriptionMessage);
  }
  
  if (shareBtn) {
    shareBtn.addEventListener('click', showShareOptions);
  }
});

// Production ready - Système de paiement Stripe intégré
