<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAINOVA — Plateforme 36 jeux (Version Simple)</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --accent1:#00ffff; --accent2:#ff00ff; --neon:#ff568c; --gold:#ffd700;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(45deg,var(--bg1),var(--bg2),var(--bg3));background-size:400% 400%;animation:gradientShift 15s ease infinite;color:#fff;font-family:'Arial',sans-serif;overflow-x:hidden}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
header{position:relative;z-index:100;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.1)}
.header-container{max-width:1200px;margin:0 auto;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Orbitron',monospace;font-size:28px;font-weight:700;background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(0,255,255,0.5);cursor:pointer}
.header-buttons{display:flex;gap:12px;align-items:center}
select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:25px;padding:8px 16px;color:#fff;font-size:14px;cursor:pointer;backdrop-filter:blur(10px)}
button{background:linear-gradient(135deg,var(--accent1),var(--accent2));border:none;border-radius:25px;padding:10px 20px;color:#000;font-weight:700;cursor:pointer;transition:all 0.3s ease;font-size:14px;text-transform:uppercase}
button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,255,255,0.4)}
#testBtn{background:#00ff88;color:#000;font-weight:bold}
.games-grid{max-width:1200px;margin:16px auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;perspective:1200px}
.card{background:linear-gradient(145deg,rgba(15,12,41,0.8),rgba(36,36,62,0.9));border-radius:20px;padding:24px;text-align:center;cursor:pointer;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px solid transparent;backdrop-filter:blur(15px);overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(45deg,transparent,rgba(255,255,255,0.1),transparent);transform:translateX(-100%);transition:transform 0.6s ease;pointer-events:none}
.card:hover::before{transform:translateX(100%)}
.card:hover{transform:translateY(-10px) rotateY(5deg) scale(1.02);box-shadow:0 25px 50px rgba(0,255,255,0.3)}
.card.free{border-color:#00ff88;box-shadow:0 0 30px rgba(0,255,136,0.4)}
.card .num{font-size:22px;font-weight:900;margin-bottom:6px;background:linear-gradient(90deg,var(--accent1),#8a2be2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .title{font-size:16px;margin-bottom:8px;color:#fff;font-weight:600}
.card .desc{font-size:12px;color:#ccc;line-height:1.4}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo">🧠 BRAINOVA</div>
    <div class="header-buttons">
      <select id="langSelect" onchange="changeLanguage()">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇺🇸 English</option>
      </select>
      <button id="testBtn" onclick="openTestModal()">🧪 Test Codes</button>
      <button onclick="showShareOptions()">📤 Partager</button>
    </div>
  </div>
</header>

<main class="games-grid" id="gamesGrid" aria-live="polite"></main>

<script>
// SANS FIREBASE - VERSION SIMPLE
const TRANSLATIONS = {
  fr: {
    games:["Quantum Tetris 2077","Mémoire Quantique","Neural Puzzle Master","Échecs Quantiques","Jeu de Dames","Pac-Man","Simon Says","Défi Vitesse","Network Check","Demo Playground","Monopoly Quantique","Neural Poker","Blackjack Quantique","Fusion Solitaire","Aventure Forêt Mystère","Puzzle Hunter","Neural Racing","Cyber Shooter","Quantum Dots","Neural Rhythm","Cyber Pinball","Quantum Pipes","Neural Slots","Cyber Darts","Quantum Bubbles","Neural Dice","Cyber Pool","Quantum Blocks","Neural Quiz","Cyber Asteroids","Quantum Crystals","Neural Infinity","Algorithmes Visuels","Physique Quantique","Test QI","Conscience IA"]
  },
  en: {
    games:["Quantum Tetris 2077","Quantum Memory","Neural Puzzle Master","Quantum Chess","Checkers Game","Pac-Man","Simon Says","Speed Challenge","Network Check","Demo Playground","Quantum Monopoly","Neural Poker","Quantum Blackjack","Fusion Solitaire","Mystery Forest Adventure","Puzzle Hunter","Neural Racing","Cyber Shooter","Quantum Dots","Neural Rhythm","Cyber Pinball","Quantum Pipes","Neural Slots","Cyber Darts","Quantum Bubbles","Neural Dice","Cyber Pool","Quantum Blocks","Neural Quiz","Cyber Asteroids","Quantum Crystals","Neural Infinity","Visual Algorithms","Quantum Physics","IQ Test","AI Consciousness"]
  }
};

function changeLanguage() {
  const lang = document.getElementById('langSelect').value;
  renderGrid(lang);
}

function renderGrid(lang) {
  const grid = document.getElementById('gamesGrid');
  const t = TRANSLATIONS[lang] || TRANSLATIONS['fr'];
  
  grid.innerHTML = '';
  
  for(let i = 1; i <= 36; i++) {
    const card = document.createElement('div');
    card.className = 'card free'; // Tous les jeux gratuits
    card.innerHTML = `
      <div class="num">${i.toString().padStart(2,'0')}</div>
      <div class="title">${t.games[i-1]}</div>
      <div class="desc">Jeu ${i} - Cliquez pour jouer</div>
    `;
    
    card.addEventListener('click', () => {
      openGame(i);
    });
    
    grid.appendChild(card);
  }
}

function openGame(n) {
  alert(`Ouverture du jeu ${n} - ${TRANSLATIONS.fr.games[n-1]}`);
}

// Fonction pour ouvrir la modal de test
function openTestModal() {
  console.log('Test modal opening...');
  const modal = document.createElement('div');
  modal.style.cssText = `
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.8); z-index: 10000; display: flex; 
    align-items: center; justify-content: center;
  `;
  
  modal.innerHTML = `
    <div style="background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 500px; margin: 20px; color: #333;">
      <h2 style="margin-bottom: 20px;">🧪 Test des Codes Premium</h2>
      <p style="margin-bottom: 15px;">Codes disponibles pour test :</p>
      <div style="background: #f0f0f0; padding: 15px; border-radius: 8px; margin: 15px 0;">
        <strong>BRAIN-2024-DEMO1</strong><br>
        <strong>BRAIN-2024-DEMO2</strong>
      </div>
      <p style="color: #666; font-size: 14px; margin: 15px 0;">
        Ces codes permettent d'accéder à tous les jeux premium.<br>
        Limitation : 1 appareil par code.
      </p>
      <button onclick="window.location.href='premium.html'" 
              style="background: #00ff88; color: #000; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px;">
        🎯 Utiliser un Code
      </button>
      <button onclick="this.parentElement.parentElement.remove()" 
              style="background: #ccc; color: #333; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; margin: 10px;">
        Fermer
      </button>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      document.body.removeChild(modal);
    }
  });
}

function showShareOptions() {
  alert('Fonctionnalité de partage - Version simple');
}

// Initialiser la grille au chargement
document.addEventListener('DOMContentLoaded', () => {
  renderGrid('fr');
});

</script>
</body>
</html>
