<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAINOVA - Version Simple Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .header-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,255,255,0.4);
        }
        
        #testBtn {
            background: #00ff88;
            color: black;
            font-size: 16px;
            font-weight: bold;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #00ff88;
            backdrop-filter: blur(10px);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,255,136,0.3);
        }
        
        .card .num {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 10px;
        }
        
        .card .title {
            font-size: 18px;
            margin-bottom: 10px;
            color: white;
        }
        
        .card .desc {
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🧠 BRAINOVA - Version Simple</div>
        <div class="header-buttons">
            <button id="testBtn" onclick="openTestModal()">🧪 Test Button</button>
            <button onclick="showInfo()">ℹ️ Info</button>
        </div>
    </header>

    <main class="games-grid" id="gamesGrid"></main>

    <script>
        console.log('=== BRAINOVA VERSION SIMPLE CHARGÉE ===');
        
        const GAMES = [
            "Quantum Tetris 2077", "Mémoire Quantique", "Neural Puzzle Master", "Échecs Quantiques",
            "Jeu de Dames", "Pac-Man", "Simon Says", "Défi Vitesse", "Network Check", "Demo Playground",
            "Monopoly Quantique", "Neural Poker", "Blackjack Quantique", "Fusion Solitaire",
            "Aventure Forêt", "Puzzle Hunter", "Neural Racing", "Cyber Shooter", "Quantum Dots",
            "Neural Rhythm", "Cyber Pinball", "Quantum Pipes", "Neural Slots", "Cyber Darts",
            "Quantum Bubbles", "Neural Dice", "Cyber Pool", "Quantum Blocks", "Neural Quiz",
            "Cyber Asteroids", "Quantum Crystals", "Neural Infinity", "Algorithmes Visuels",
            "Physique Quantique", "Test QI", "Conscience IA"
        ];

        function renderGames() {
            console.log('=== RENDU DES JEUX ===');
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            for(let i = 1; i <= 36; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="num">${i.toString().padStart(2, '0')}</div>
                    <div class="title">${GAMES[i-1]}</div>
                    <div class="desc">✅ Accès gratuit - Cliquez pour jouer</div>
                `;
                
                card.addEventListener('click', () => {
                    console.log(`Ouverture du jeu ${i}`);
                    alert(`🎮 Jeu ${i}: ${GAMES[i-1]}\n\n✅ ACCÈS GRATUIT !`);
                });
                
                grid.appendChild(card);
            }
            console.log('=== 36 JEUX AJOUTÉS AVEC SUCCÈS ===');
        }

        // Fonction principale de test
        function openTestModal() {
            console.log('=== BOUTON TEST CLIQUÉ ===');
            
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.8);
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            
            modal.innerHTML = `
                <div style="
                    background: white;
                    padding: 40px;
                    border-radius: 20px;
                    text-align: center;
                    max-width: 500px;
                    margin: 20px;
                    color: #333;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
                ">
                    <h2 style="margin-bottom: 20px; color: #2E7D32;">🧪 Test Modal - Fonctionnel !</h2>
                    <p style="margin-bottom: 15px; font-size: 18px;"><strong>✅ SUCCÈS !</strong></p>
                    <p style="margin-bottom: 20px;">Le bouton Test fonctionne parfaitement dans cette version simple.</p>
                    
                    <div style="background: #e8f5e8; padding: 20px; border-radius: 10px; margin: 20px 0; border: 2px solid #4CAF50;">
                        <h3 style="color: #2E7D32; margin-bottom: 10px;">État du système :</h3>
                        <p style="margin: 5px 0; color: #2E7D32;">✅ Version simple sans Firebase</p>
                        <p style="margin: 5px 0; color: #2E7D32;">✅ Pas de système premium complexe</p>
                        <p style="margin: 5px 0; color: #2E7D32;">✅ Bouton Test 100% fonctionnel</p>
                        <p style="margin: 5px 0; color: #2E7D32;">✅ Tous les jeux gratuits</p>
                    </div>
                    
                    <p style="color: #666; font-size: 14px; margin: 20px 0;">
                        Cette version prouve que le bouton Test fonctionne.<br>
                        Le problème était dans la complexité du système Firebase/Premium.
                    </p>
                    
                    <button onclick="this.parentElement.parentElement.remove()" 
                            style="
                                background: #4CAF50;
                                color: white;
                                padding: 15px 30px;
                                border: none;
                                border-radius: 8px;
                                cursor: pointer;
                                font-weight: bold;
                                font-size: 16px;
                                margin: 10px;
                            ">
                        ✅ Parfait - Fermer
                    </button>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Fermer en cliquant à l'extérieur
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            });
            
            console.log('=== MODAL DE TEST AFFICHÉE AVEC SUCCÈS ===');
        }

        function showInfo() {
            alert('ℹ️ BRAINOVA Version Simple\n\n✅ 36 jeux gratuits\n✅ Pas de premium\n✅ Bouton Test fonctionnel');
        }

        // Initialiser au chargement
        document.addEventListener('DOMContentLoaded', () => {
            console.log('=== INITIALISATION DE LA PAGE ===');
            renderGames();
            console.log('=== PAGE PRÊTE ===');
        });
    </script>
</body>
</html>
