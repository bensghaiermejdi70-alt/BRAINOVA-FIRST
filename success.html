<script>
  document.addEventListener("DOMContentLoaded", () => {
    const status = sessionStorage.getItem('brainova_user_status') ||
                   document.cookie.includes("brainova_user_status=premium");
    
    if (status) {
      console.log("🎮 Accès Premium activé !");
      document.querySelectorAll(".premium-game").forEach(el => {
        el.classList.remove("locked");
        el.querySelector(".subscribe-message")?.remove();
      });
    } else {
      console.log("🔒 Mode gratuit – Premium verrouillé");
    }
  });
</script>
