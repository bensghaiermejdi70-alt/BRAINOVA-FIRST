######################################
# 🧠 Brainova - Netlify Production Config
# ✅ Stripe + Firebase + Brevo
######################################

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions, package.json, netlify.toml"
  HIDE_ENV_VARS = "true"

######################################
# 🚫 Désactivation des optimisations Netlify
######################################
[build.processing]
  skip_processing = true

[build.processing.css]
  minify = false

[build.processing.js]
  minify = false

[build.processing.html]
  pretty_urls = false

######################################
# 🔄 Redirections API
######################################

# ✅ Route principale pour les fonctions serverless
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ✅ Alias direct pour ton webhook Stripe
[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# ✅ Alias direct pour verify-premium
[[redirects]]
  from = "/verify"
  to = "/.netlify/functions/verify-premium"
  status = 200

# ✅ Alias pour create-checkout-session
[[redirects]]
  from = "/checkout"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

# ✅ Envoi d'email
[[redirects]]
  from = "/sendEmail"
  to = "/.netlify/functions/sendemail"
  status = 200

# ✅ HTTPS forcé
[[redirects]]
  from = "http://*"
  to = "https://brainovafirst.netlify.app/:splat"
  status = 301
  force = true

######################################
# 🧱 Headers de sécurité HTTP
######################################
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ✅ Autorise Stripe, Firebase, Google, ReCAPTCHA, Brevo
    Content-Security-Policy = """
      default-src 'self' data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        *.stripe.com
        *.googleapis.com
        *.firebase.com
        *.firebaseapp.com
        *.auth0.com
        cdn.auth0.com
        js.stripe.com
        www.gstatic.com
        cdn.emailjs.com
        www.google.com
        www.recaptcha.net;
      style-src 'self' 'unsafe-inline' fonts.googleapis.com;
      font-src 'self' fonts.gstatic.com;
      img-src 'self' data: blob: *;
      media-src 'self' data: blob: *;
      connect-src 'self'
        *.auth0.com
        *.firebase.com
        *.firebaseapp.com
        *.googleapis.com
        firebaseinstallations.googleapis.com
        www.gstatic.com
        js.stripe.com
        cdn.emailjs.com;
      frame-src 'self'
        *.auth0.com
        js.stripe.com
        www.google.com
        www.recaptcha.net;
      child-src 'self'
        *.auth0.com
        js.stripe.com
        www.google.com
        www.recaptcha.net;
    """

    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

######################################
# ⚙️ Functions Netlify
######################################
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

######################################
# 🧪 Développement local
######################################
[dev]
  framework = "#static"
  targetPort = 8888
