[build]
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.stripe.com *.googleapis.com *.firebase.com *.firebaseapp.com *.auth0.com cdn.auth0.com js.stripe.com www.gstatic.com cdn.emailjs.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob: *; media-src 'self' data: blob: *; connect-src 'self' *.auth0.com *.firebase.com *.firebaseapp.com *.googleapis.com js.stripe.com cdn.emailjs.com; frame-src 'self' *.auth0.com js.stripe.com; child-src 'self' *.auth0.com js.stripe.com;"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "stripe-webhook"
  path = "/api/stripe-webhook"

[dev]
  framework = "#static"
  targetPort = 8888
