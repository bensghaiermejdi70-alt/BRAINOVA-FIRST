######################################
# 🧠 Brainova - Netlify Production Config
# Version anti-scan & conforme sécurité
######################################

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

  # 🚫 Désactivation propre du scan automatique
  SECRETS_SCAN_ENABLED = "false"

  # 🧱 Ignore les chemins où le scanner voit des "faux positifs"
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions, package.json, netlify.toml"

  # 🚫 Empêche l’affichage de variables dans les logs
  HIDE_ENV_VARS = "true"

######################################
# 🔄 Redirections API
######################################

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/sendEmail"
  to = "/.netlify/functions/sendemail"
  status = 200

######################################
# 🧱 Headers de sécurité HTTP
######################################

[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    Content-Security-Policy = """
      default-src 'self' data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        *.stripe.com
        *.googleapis.com
        *.firebase.com
        *.firebaseapp.com
        *.auth0.com
        cdn.auth0.com
        js.stripe.com
        www.gstatic.com
        cdn.emailjs.com
        www.google.com
        www.recaptcha.net;
      style-src 'self' 'unsafe-inline' fonts.googleapis.com;
      font-src 'self' fonts.gstatic.com;
      img-src 'self' data: blob: *;
      media-src 'self' data: blob: *;
      connect-src 'self'
        *.auth0.com
        *.firebase.com
        *.firebaseapp.com
        *.googleapis.com
        firebaseinstallations.googleapis.com
        www.gstatic.com
        js.stripe.com
        cdn.emailjs.com;
      frame-src 'self'
        *.auth0.com
        js.stripe.com
        www.google.com
        www.recaptcha.net;
      child-src 'self'
        *.auth0.com
        js.stripe.com
        www.google.com
        www.recaptcha.net;
    """

######################################
# ⚙️ Functions Netlify
######################################

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "stripe-webhook"
  path = "/api/stripe-webhook"

######################################
# 🧪 Développement local
######################################

[dev]
  framework = "#static"
  targetPort = 8888

