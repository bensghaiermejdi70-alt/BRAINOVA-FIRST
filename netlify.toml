[build]
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ✅ Politique de sécurité mise à jour : inclut Google reCAPTCHA et Firebase
    Content-Security-Policy = """
      default-src 'self' data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        *.stripe.com
        *.googleapis.com
        *.firebase.com
        *.firebaseapp.com
        *.auth0.com
        cdn.auth0.com
        js.stripe.com
        www.gstatic.com
        cdn.emailjs.com
        www.google.com
        www.recaptcha.net;
      style-src 'self' 'unsafe-inline' fonts.googleapis.com;
      font-src 'self' fonts.gstatic.com;
      img-src 'self' data: blob: *;
      media-src 'self' data: blob: *;
      connect-src 'self'
        *.auth0.com
        *.firebase.com
        *.firebaseapp.com
        *.googleapis.com
        js.stripe.com
        cdn.emailjs.com;
      frame-src 'self'
        *.auth0.com
        js.stripe.com
        www.google.com
        www.recaptcha.net;
      child-src 'self'
        *.auth0.com
        js.stripe.com
        www.google.com
        www.recaptcha.net;
    """

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "stripe-webhook"
  path = "/api/stripe-webhook"

[dev]
  framework = "#static"
  targetPort = 8888
