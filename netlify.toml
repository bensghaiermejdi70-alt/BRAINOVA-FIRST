[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' *.stripe.com *.googleapis.com *.firebase.com *.firebaseapp.com data: blob:; frame-src 'self'; child-src 'self'; img-src 'self' data: blob: *; media-src 'self' data: blob: *;"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "stripe-webhook"
  path = "/api/stripe-webhook"

[dev]
  framework = "#static"
  targetPort = 8888
