######################################
# 🧠 Brainova - Netlify Production Config
# Compatible PC + Mobile (activate-device + activate/)
######################################

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_ENABLED = "false"
  HIDE_ENV_VARS = "true"

######################################
# 🚫 Désactivation des optimisations Netlify
######################################

[build.processing]
  skip_processing = true

[build.processing.css]
  minify = false

[build.processing.js]
  minify = false

[build.processing.html]
  pretty_urls = false

######################################
# 🔄 Redirections FUNCTIONS
######################################

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/verify"
  to = "/.netlify/functions/verify-premium"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/sendEmail"
  to = "/.netlify/functions/sendemail"
  status = 200

### 👉 Route pour activer PC/Mobile
[[redirects]]
  from = "/activate-device"
  to = "/.netlify/functions/activate-device"
  status = 200

######################################
# 🔄 Redirection page d’activation
######################################

[[redirects]]
  from = "/activate"
  to = "/activate/index.html"
  status = 200

######################################
# 🌍 Redirection HTTP → HTTPS (Netlify domain)
######################################

[[redirects]]
  from = "http://*"
  to = "https://brainovafirst.netlify.app/:splat"
  status = 301
  force = true

######################################
# 🧱 Headers de sécurité HTTP (CSP corrigée)
######################################

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    Content-Security-Policy = """
      default-src 'self' data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        *.stripe.com
        *.googleapis.com
        *.firebase.com
        *.firebaseapp.com
        js.stripe.com
        www.gstatic.com;
      style-src 'self' 'unsafe-inline' fonts.googleapis.com;
      font-src 'self' fonts.gstatic.com;
      img-src 'self' data: blob: *;
      media-src 'self' data: blob: *;

      connect-src 'self'
        https://brainovafirst.netlify.app
        https://brainovafirst.netlify.app/.netlify/functions/
        *.firebaseapp.com
        *.firebase.com
        *.googleapis.com
        js.stripe.com
        https://api.brevo.com;

      frame-src 'self' js.stripe.com;
    """

    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

######################################
# ⚙️ Functions Netlify
######################################

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

######################################
# 🧪 Développement local
######################################

[dev]
  framework = "#static"
  targetPort = 8888
